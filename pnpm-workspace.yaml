# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Any npm package version must have been published for at least 1 day (1440
# minutes) before pnpm will install it. Malicious npm releases are usually
# discovered and pulled within hours, so a 1-day delay is a strong buffer.
#
# DO NOT DISABLE THIS SETTING. If you genuinely need a package before the
# window has passed (e.g. an urgent security fix), add a
# minimumReleaseAgeExclude allowlist and remove it once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*

catalog:
  react: 19.1.0
  react-dom: 19.1.0

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
