<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>fishy-five</title>
    <style>
      /* Document direction stays ltr on purpose: the aquarium and its arrow
         navigation are physically left-to-right in both languages, and text
         direction is applied per element from the translations file's `dir`.
         Setting dir="rtl" here would mirror every flex row, including the
         tap targets over the canvas. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #011627;
        overflow: hidden;
        direction: ltr;
      }
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
